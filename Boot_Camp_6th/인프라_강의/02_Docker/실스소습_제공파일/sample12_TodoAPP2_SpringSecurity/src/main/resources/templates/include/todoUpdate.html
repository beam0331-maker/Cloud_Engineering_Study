<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete</title>
</head>
<body>
<div th:fragment="content">
    <form  th:action="@{/todo-update}" th:object="${dto}" method="post">
        id: <input type="text" th:field="*{id}"><br>
        할일: <input type="text" th:field="*{description}"  ><br>
        목표일: <input type="date" th:field="*{targetDate}" ><br>
        <p th:if="${#fields.hasErrors('targetDate')}" th:errors="*{targetDate}"></p>
        완료여부: <input type="checkbox" th:field="*{done}" ><br>
        <input type="submit" value="저장">
    </form>
</div>
</body>
</html>
