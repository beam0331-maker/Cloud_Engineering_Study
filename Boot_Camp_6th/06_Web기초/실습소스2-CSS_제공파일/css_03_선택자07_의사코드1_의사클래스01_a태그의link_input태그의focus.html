<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>pseudo 실습</title>
    <style>
      /* 순서 준수*/
      /* unvisited link */
      a:link {
        color: red;
      }
      /* visited link */
      a:visited {
        color: green;
      }
      /* mouse over link */
      a:hover {
        color: yellow;
      }
      /* selected link */
      a:active {
        color: blue;
      }

      input:focus {
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <a href="#" target="_blank">This is a link1</a><br />
    <a href="daum.net" target="_blank">This is a link2</a><br />
    <br />
    아이디:<input /><br />
    비번:<input /><br />
  </body>
</html>
