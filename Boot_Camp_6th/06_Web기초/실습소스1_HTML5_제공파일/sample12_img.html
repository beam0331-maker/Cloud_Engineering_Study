<!doctype html>
<html lang="en">
  <head>
    <title>안녕하세요</title>
  </head>
  <body>
    <!-- 이미지 파일
        alt="value" : 이미지가 없다면 대체로 value로 대체된다
        사이즈 지정하지 않으면 원본 파일이 나온다
     -->
    <img src="images/a.jpg" alt="이미지" /> <br />
    <img src="images/d.jpg" alt="없는이미지" /> <br />
    <img src="images/c.jpg" width="100" height="100" alt="이미지" /> <br />
  </body>
</html>
