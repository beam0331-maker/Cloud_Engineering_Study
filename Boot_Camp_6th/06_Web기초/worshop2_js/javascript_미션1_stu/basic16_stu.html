<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      let resutl = "";
      for (let i = 0; i <= 9; i++) {
        let array = [];
        for (let j = 1; j <= 10; j++) {
          array.push(i * 10 + j);
        }
        let row = array.join(" ") + "\n";
        resutl += row;
      }
      console.log(resutl);
    </script>
  </head>
  <body></body>
</html>
