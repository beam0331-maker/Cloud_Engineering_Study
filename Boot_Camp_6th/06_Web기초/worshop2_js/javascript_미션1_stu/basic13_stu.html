<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      let result = 0;
      let result2 = 0;
      for (let i = 1; i <= 100; i++) {
        result += i;
        if (i % 3 == 0) {
          result2 += i;
        }
      }
      console.log(`1~100까지의 총합: ${result}`);
      console.log(`1~100까지의 3의 배수 총합: ${result2}`);
    </script>
  </head>
  <body></body>
</html>
