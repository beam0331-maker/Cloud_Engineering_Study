<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      let score = Number.parseInt(window.prompt("1. 정수값을 입력하시오."));
      console.log(`입력값은: ${score}`);
      let grade;
      if (score >= 90) {
        grade = "1등급";
      } else if (score >= 80) {
        grade = "2등급";
      } else if (score >= 70) {
        grade = "3등급";
      } else {
        grade = "4등급";
      }
      console.log(`등급: ${grade}`);
    </script>
  </head>
  <body></body>
</html>
