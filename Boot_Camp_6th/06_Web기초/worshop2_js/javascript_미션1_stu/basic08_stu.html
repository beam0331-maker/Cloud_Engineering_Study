<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      let firIn = Number.parseInt(window.prompt("1. 정수값을 입력하시오."));
      console.log(`첫번째 입력값은: ${firIn}`);
      let secIn = Number.parseInt(window.prompt("2. 정수값을 입력하시오."));
      console.log(`두번째 입력값은: ${secIn}`);
      let max;
      if (firIn >= secIn) {
        max = firIn;
      } else {
        max = secIn;
      }

      console.log(`최대값은: ${max}`);
    </script>
  </head>
  <body></body>
</html>
