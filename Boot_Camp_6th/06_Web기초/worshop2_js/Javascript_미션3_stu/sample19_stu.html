<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      window.onload = init;
      function init() {
        let search = document.querySelector("#v1");
        search.addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            let input = search.value;
            document.querySelector("#result").innerHTML += input + "<br/>";
          }
        });
      }
    </script>
  </head>
  <body>
    값:<input type="search" name="v1" id="v1" />
    <div id="result"></div>
  </body>
</html>
