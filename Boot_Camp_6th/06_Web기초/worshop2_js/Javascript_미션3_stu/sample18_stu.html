<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      function save() {
        let input = document.querySelector("#v1").value;
        document.querySelector("#result").innerHTML += input + "<br/>";
      }
    </script>
  </head>
  <body>
    값:<input type="search" name="v1" id="v1" /> <button onClick="save()">저장</button><br />

    <div id="result"></div>
  </body>
</html>
