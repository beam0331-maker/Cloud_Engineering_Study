<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      function checkAll() {
        let allCheck = document.querySelector('input[name="all"]');

        let checkbox = document.querySelectorAll(".lang");
        checkbox.forEach((e) => {
          e.checked = allCheck.checked;
        });
      }
    </script>
  </head>
  <body>
    전체선택
    <input type="checkbox" name="all" onclick="checkAll()" /><br />
    <input type="checkbox" name="java" class="lang" />java<br />
    <input type="checkbox" name="sql" class="lang" />sql<br />
    <input type="checkbox" name="angular" class="lang" />angular<br />
  </body>
</html>
