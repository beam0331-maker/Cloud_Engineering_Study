<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      window.onload = init;
      function init() {
        let result = document.querySelector("#result");

        let [passwdInput, passwdCheckInput] = document.querySelectorAll('[type="text"]');

        function passwdCheck() {
          let p1 = passwdInput.value;
          let p2 = passwdCheckInput.value;

          if (p1 === p2) {
            result.textContent = "일치";
          } else {
            result.textContent = "불일치";
          }
        }

        passwdInput.addEventListener("input", passwdCheck);
        passwdCheckInput.addEventListener("input", passwdCheck);
      }
    </script>
  </head>
  <body>
    비밀번호 확인 구현<br />
    비밀번호<input type="text" name="passwd" id="passwd" /><br />
    비밀번호 재확인<input type="text" name="passwd1" id="passwd1" onkeyup="" />
    <span id="result"></span>
  </body>
</html>
