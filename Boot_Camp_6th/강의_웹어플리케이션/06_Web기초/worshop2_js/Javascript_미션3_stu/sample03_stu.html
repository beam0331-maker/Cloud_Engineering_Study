<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      window.onload = init;
      function init() {
        let test = document.querySelector("textarea");
        document.querySelector("textarea").addEventListener("input", (e) => {
          document.querySelector("#result").innerHTML = e.target.value.length;
        });
      }
    </script>
  </head>
  <body>
    글자수 세기<br />
    <textarea rows="10" cols="10"></textarea><br />
    입력문자수:<span id="result"></span>
  </body>
</html>
