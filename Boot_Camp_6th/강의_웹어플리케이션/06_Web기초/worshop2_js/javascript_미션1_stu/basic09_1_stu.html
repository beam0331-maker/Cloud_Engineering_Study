<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      let firScore = Number.parseInt(window.prompt("1. 면접 점수값을 입력하시오."));
      console.log(`면접점수: ${firScore}`);
      let secScore = Number.parseInt(window.prompt("2. 영어 점수값을 입력하시오."));
      console.log(`영어점수: ${secScore}`);
      let avg = (firScore + secScore) / 2;
      console.log(`영어점수: ${secScore}`);
      let result = avg >= 80 ? "합격" : "불합격";
      console.log(`합격여부: ${result}`);
    </script>
  </head>
  <body></body>
</html>
