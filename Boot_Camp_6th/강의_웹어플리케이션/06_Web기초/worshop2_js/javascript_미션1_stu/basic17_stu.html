<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert title here</title>
    <script type="text/javascript">
      let n = Number.parseInt(window.prompt("정수값을 입력하시오."));
      console.log(`입력한 정수값: ${n}`);
      let resutl = 0;
      for (let i = 1; i < n; i++) {
        resutl += i;
      }
      console.log(`1부터 입력한 정수값까지의 총함: ${resutl}`);
    </script>
  </head>
  <body></body>
</html>
