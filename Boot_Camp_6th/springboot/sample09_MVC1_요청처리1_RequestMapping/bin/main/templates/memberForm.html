<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>memberForm</h1>
<h2>1. GET 요청</h2>
<form action="member" method="get">
    id: <input type="text" name="userid"> <br>
    pw: <input type="text" name="passwd"> <br>
    <input type="submit" value="회원가입">
</form>

<h2>2. POST 요청</h2>
<form action="member" method="post">
    id: <input type="text" name="userid"> <br>
    pw: <input type="text" name="passwd"> <br>
    <input type="submit" value="회원가입">
</form>

</body>
</html>
