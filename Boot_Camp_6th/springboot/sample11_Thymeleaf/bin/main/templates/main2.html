<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>2. scope에 객체 저장하고 html에서 보여주기</h1>
<h2>가. 중첩형태로 접근</h2>
login객체: <p th:text="${login}"></p>
login객체: <p th:text="${login.toString()}"></p>
userid:  <p th:text="${login.userid}"></p>
password: <p th:text="${login.password}"></p>

<h2>나. 객체 속성형태로 접근</h2>
<div th:object="${login}">
   ID: <span th:text="*{userid}"></span>
   PW: <span th:text="*{password}"></span>
</div>
</body>
</html>
